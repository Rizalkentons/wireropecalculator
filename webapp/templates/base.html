<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Quotation Picture Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="topnav">
        <a class="brand" href="{{ url_for('index') }}"><span class="dot"></span>WireRope<strong>.</strong></a>
        <div style="display:flex; align-items:center; gap:1.25rem;">
            <a class="home-link" href="{{ url_for('index') }}">&larr; Home</a>
            <form action="{{ url_for('auth.logout') }}" method="post">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </nav>
    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
